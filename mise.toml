# Tool versions for the whole monorepo, managed by mise (mise.jdx.dev).
# Prune any tool whose stack was not scaffolded.
[tools]
node = "26"      # frontend (react-csr / astro-site)
pnpm = "12"      # frontend package manager (jsr: prefix needs >= 12)
rust = { version = "1.99.0", targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"] }  # backend (rust-api); toasty requires >= 1.95; musl for the static release binary
watchexec = "2.8.0"  # backend hot reload (dev:backend)

[tasks.dev]
description = "Run dev mode"
depends = ["dev:backend", "dev:frontend"]

# Convenience tasks: `mise run <task>` (`mise r <task>`).
# Prune tasks whose directory was not scaffolded.
[tasks."dev:backend"]
description = "Run the backend API server, restarting on source changes"
dir = "backend"
run = "watchexec --restart --stop-signal SIGINT --watch src --watch Cargo.toml --watch Cargo.lock --exts rs,toml -- cargo run"

[tasks."dev:frontend"]
description = "Run the frontend dev server"
dir = "frontend"
run = "pnpm dev"

[tasks.clean]
description = "Delete the local dev database and uploaded files (recreated from the migrations on next backend start)"
dir = "backend"
run = "rm -rf woodmouse.db woodmouse.db-shm woodmouse.db-wal data"

[tasks.seed]
description = "Fill an empty dev database with mock data (run `mise run clean` first to start over)"
dir = "backend"
run = "cargo run -- seed"

# rust-embed needs frontend/dist to exist to compile the main binary, hence the build.
[tasks."check:backend"]
description = "Run backend checks (rustfmt, clippy)"
dir = "backend"
depends = ["build:frontend"]
run = "mise run check"

# The typecheck needs the generated API client.
[tasks."check:frontend"]
description = "Run frontend checks (typecheck, lint, format)"
dir = "frontend"
depends = ["gen:client"]
run = "pnpm check"

[tasks."build:frontend"]
description = "Build the frontend bundle into frontend/dist"
dir = "frontend"
depends = ["gen:client"]
run = "pnpm build"

[tasks."install:frontend"]
description = "Install frontend workspace dependencies"
dir = "frontend"
run = "pnpm install"  # frozen automatically when CI is set

# Client generation pipeline: spec (backend only, no frontend bundle needed)
# -> heyapi openapi-ts -> frontend/packages/client/src (never committed).
[tasks."gen:spec"]
description = "Generate the OpenAPI spec from the backend"
dir = "backend"
run = "cargo specs"
# Skip regeneration while the sources are older than the generated specs.
sources = ["src/**/*.rs", "Cargo.toml"]
outputs = ["target/specs/openapi.json", "target/specs/openapi.yaml"]

[tasks."gen:client"]
description = "Regenerate the heyapi client package from the OpenAPI spec"
depends = ["gen:spec", "install:frontend"]
dir = "frontend/packages/client"
run = "pnpm exec openapi-ts"

[tasks."build:backend"]
description = "Build the backend (embeds frontend/dist at compile time)"
dir = "backend"
run = "cargo build"

[tasks.build]
description = "Build frontend (generates the client first), then backend with the bundle embedded"
run = "mise run build:frontend && mise run build:backend"

[tasks."test:backend"]
description = "Run the backend tests"
dir = "backend"
depends = ["build:frontend"]
run = "cargo test"

[tasks."test:frontend"]
description = "Run the frontend tests"
dir = "frontend"
depends = ["install:frontend"]
run = "pnpm test"

[tasks.test]
description = "Run each stack's tests"
depends = ["test:backend", "test:frontend"]

[tasks."build:docker"]
description = "Build the container image (natively, for this machine's architecture)"
run = "podman build -t woodmouse ."

[tasks.check]
description = "Run each stack's checks"
depends = ["check:backend", "check:frontend"]

[tasks."fix:backend"]
description = "Auto-fix backend lint and formatting"
dir = "backend"
run = "mise run fix"

[tasks."fix:frontend"]
description = "Auto-fix frontend lint and formatting"
dir = "frontend"
run = "pnpm fix"

[tasks.fix]
description = "Auto-fix in each stack"
depends = ["fix:backend", "fix:frontend"]
