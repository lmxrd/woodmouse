# Tool versions for the whole monorepo, managed by mise (mise.jdx.dev).
# Convenience tasks: `mise run <task>` (`mise r <task>`).
# Prune any tool or task whose stack was not scaffolded.

# ---------------------------------------------------------------------------
# Tools
# ---------------------------------------------------------------------------

[tools]
node = "26" # frontend (react-csr / astro-site)
pnpm = "12" # frontend package manager (jsr: prefix needs >= 12)
rust = { version = "1.99.0", components = [
  "clippy",
  "llvm-tools",
  "rustfmt",
], targets = [
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
] } # backend (rust-api); musl for the static release binary
watchexec = "2.8.0" # backend hot reload (dev:backend)
zig = "0.15.2" # musl cross-compile (cargo zigbuild): C code for ring/SQLite and static linking
"github:rust-cross/cargo-zigbuild" = "0.24.0" # builds the static release binaries via zig cc (scripts/build-linux.sh)
"cargo:sea-orm-cli" = "2.0.4" 
"aqua:google/osv-scanner" = "2.7.0" # known vulnerabilities in the lockfiles (mise run audit)
"aqua:aquasecurity/trivy" = "0.76.1" # known vulnerabilities in the image (mise run audit:image)

[env]
DATABASE_URL = "sqlite:woodmouse.db?mode=rwc"


# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------

[tasks.build]
description = "Build frontend (generates the SDK first), then the static Linux binary with the bundle embedded"
depends = ["build:linux"]

[tasks."build:frontend"]
description = "Build the frontend bundle into frontend/dist"
dir = "packages/frontend"
depends = ["gen:sdk"]
run = "pnpm build"

# The binary is written to dist/woodmouse-linux-<arch> (see the script for
# ARCH, PROFILE and FEATURES). A variant image, e.g. a debug (dev profile) build:
#   PROFILE=dev scripts/build-linux.sh
#   podman build --build-arg BINARY=dist/woodmouse-linux-arm64-dev -t woodmouse:dev .
[tasks."build:linux"]
description = "Build the static (musl) Linux binary for this machine's CPU architecture into dist/, with the frontend embedded"
depends = ["build:frontend"]
run = "scripts/build-linux.sh"

[tasks."build:docker"]
description = "Build the container image from the Linux binary in dist/ (for this machine's architecture)"
depends = ["build:linux"]
run = "podman build --format docker -t woodmouse ."

# rust-embed fails to compile when packages/frontend/dist does not exist, but
# checks and tests never read the bundle, so an empty directory is enough:
# they need not wait for the frontend build. Release builds
# (build:linux) still depend on the real build:frontend.
[tasks."ensure:dist"]
description = "Make sure packages/frontend/dist exists (rust-embed needs the folder to compile)"
run = "mkdir -p packages/frontend/dist"

# ---------------------------------------------------------------------------
# Development
# ---------------------------------------------------------------------------

[tasks.dev]
description = "Run dev mode"
depends = ["dev:backend", "dev:frontend"]

[tasks."dev:backend"]
description = "Run and watch for changes for the backend"
dir = "packages/backend"
run = "watchexec --restart --stop-signal SIGINT --watch src --watch api --watch entity --watch migration --watch Cargo.toml --watch Cargo.lock --exts rs,toml,sql --ignore '**/target/**' -- cargo run"

[tasks."dev:frontend"]
description = "Run the frontend dev server"
dir = "packages/frontend"
run = "pnpm dev"

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------

[tasks.clean]
description = "Delete the local dev database and uploaded files (recreated from the migrations on next backend start)"
run = "rm -rf dist node_modules packages/backend/target packages/frontend/node_modules packages/frontend/dist packages/sdk/node_modules packages/sdk/src"

[tasks.migrate]
description = "Apply the pending migrations to the dev database (the backend also does this when it starts)"
dir = "packages/backend"
run = "cargo run --package migration -- up"

[tasks.seed]
description = "Fill an empty dev database with mock data (run `mise run clean` first to start over)"
dir = "packages/backend"
run = "cargo run --package api --bin seed"
depends = ["migrate"]

# ---------------------------------------------------------------------------
# Code generation
# ---------------------------------------------------------------------------

[tasks."gen:spec"]
description = "Generate the OpenAPI spec from the backend"
dir = "packages/backend"
run = "cargo run --package api --bin specs"
# Skip regeneration while the sources are older than the generated specs.
sources = ["api/**/*.rs", "entity/**/*.rs", "migration/**/*.rs", "**/Cargo.toml"]
outputs = ["target/specs/openapi.json", "target/specs/openapi.yaml"]

[tasks."gen:sdk"]
description = "Regenerate the SDK (packages/sdk) from the OpenAPI spec"
depends = ["gen:spec", "install:frontend"]
dir = "packages/sdk"
run = "pnpm run openapi-ts"
# Skip regeneration while the spec is older than the generated SDK.
sources = ["../backend/target/specs/openapi.json"]
outputs = ["src/index.ts"]

[tasks."gen:models"]
description = "Regenerate the entities in packages/backend/entity/src from the migrated schema (review the diff)"
dir = "packages/backend"
depends = ["migrate"]
run = """
sea-orm-cli generate entity --lib --output-dir entity/src --entity-format compact --with-prelude none --experimental-preserve-user-modifications --ignore-tables seaql_migrations,search_docs,search_fts,search_fts_data,search_fts_idx,search_fts_docsize,search_fts_config
cargo fmt --all
"""

# ---------------------------------------------------------------------------
# Checks
# ---------------------------------------------------------------------------

[tasks.check]
description = "Run each stack's checks"
depends = ["check:backend", "check:frontend"]

[tasks."check:backend"]
description = "Run backend checks (rustfmt, clippy)"
dir = "packages/backend"
depends = ["ensure:dist"]
run = ["cargo fmt --all --check", "cargo clippy --workspace --all-targets --all-features -- -D warnings"]

# The typecheck needs the generated SDK.
[tasks."check:frontend"]
description = "Run frontend checks (typecheck, lint, format)"
dir = "packages/frontend"
depends = ["gen:sdk"]
run = "pnpm check"

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------

[tasks.test]
description = "Run each stack's tests"
depends = ["test:backend", "test:frontend"]

[tasks."test:backend"]
description = "Run the backend tests"
dir = "packages/backend"
depends = ["ensure:dist"]
run = "cargo test --workspace"

# The tests import the generated SDK.
[tasks."test:frontend"]
description = "Run the frontend tests"
dir = "packages/frontend"
depends = ["gen:sdk"]
run = "pnpm test"

# ---------------------------------------------------------------------------
# Fixes
# ---------------------------------------------------------------------------

[tasks.fix]
description = "Auto-fix in each stack"
depends = ["fix:backend", "fix:frontend"]

[tasks."fix:backend"]
description = "Auto-fix backend lint and formatting"
dir = "packages/backend"
run = [
  "cargo fmt --all",
  "cargo clippy --fix --allow-dirty --allow-staged --allow-no-vcs --workspace --all-targets --all-features -- -D warnings",
]

[tasks."fix:frontend"]
description = "Auto-fix frontend lint and formatting"
dir = "packages/frontend"
run = "pnpm fix"

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------

# Every day in CI too (security.yml): new advisories come out for
# dependencies that did not change. A finding to accept goes in
# osv-scanner.toml, with the reason.
[tasks.audit]
description = "Known vulnerabilities in the locked crates and npm packages (osv-scanner: OSV, RustSec and GitHub advisories)"
run = "osv-scanner scan source --config osv-scanner.toml --lockfile packages/backend/Cargo.lock --lockfile pnpm-lock.yaml"

# The binary is static, so this is about the Alpine base. CI scans the image
# it builds (IMAGE=woodmouse:ci).
[tasks."audit:image"]
description = "Known vulnerabilities in an image's Alpine packages (Trivy): fixable HIGH and CRITICAL ones fail; IMAGE picks it, by default the published one"
run = 'trivy image --skip-version-check --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "${IMAGE:-ghcr.io/lmxrd/woodmouse:latest}"'

# ---------------------------------------------------------------------------
# Dependencies
# ---------------------------------------------------------------------------

[tasks."install:frontend"]
description = "Install the JavaScript workspace (frontend and SDK) from the root lockfile"
run = "pnpm install" # frozen automatically when CI is set
