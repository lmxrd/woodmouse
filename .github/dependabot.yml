# Dependency updates, weekly, in one pull request for every ecosystem (a
# multi-ecosystem group), plus security updates as soon as an advisory is
# out (those are switched on in the repository's settings, use the entries
# below and come in pull requests of their own).
#
# - Its title is a Conventional Commit, because pull requests are squash
#   merged with their title and release-please reads it: `fix(deps)`, since
#   it nearly always has something that ships (the backend's crates, the
#   frontend's and SDK's dependencies, the base image), so merging it makes
#   release-please open a patch release. A group has one title, so the
#   actions and the devDependencies come under `fix(deps)` too.
# - It merges on its own once CI passes (dependabot-auto-merge.yml), unless
#   it has a major update: then all of it waits for a person.
# - A routine update waits 5 days after its release (cooldown): most
#   hijacked releases are found and pulled within that time. Security
#   updates do not wait. pnpm's own minimum release age (1 day, in
#   pnpm-workspace.yaml) is shorter, so it never blocks an update Dependabot
#   proposes; it holds an npm security fix back by a day at most.
version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
      day: monday
    # Only the group can set it, not the entries below.
    commit-message:
      prefix: fix
      include: scope

updates:
  # The backend. Cargo.lock is bumped with the manifests.
  - package-ecosystem: cargo
    directory: /packages/backend
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    cooldown:
      default-days: 5
    # One pull request has every update, so one that does not build would
    # hold back all of them. axum-login 0.18 (the newest) needs
    # tower-sessions 0.14: its majors wait until axum-login takes them.
    ignore:
      - dependency-name: tower-sessions
        update-types: ["version-update:semver-major"]

  # The JavaScript workspace (frontend and SDK): one pnpm-lock.yaml at the root.
  - package-ecosystem: npm
    directory: /
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    cooldown:
      default-days: 5

  # The versions of the actions the workflows use.
  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    cooldown:
      default-days: 5

  # The base image of the Dockerfile, pinned to an exact Alpine release
  # (alpine:3.x.y). The image builds nothing; the toolchains (package.json's
  # devEngines and packageManager, rust-toolchain.toml) are bumped by a
  # person (Node's must be an LTS).
  - package-ecosystem: docker
    directory: /
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    cooldown:
      default-days: 5
