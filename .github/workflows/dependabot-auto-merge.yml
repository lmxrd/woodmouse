name: Dependabot auto-merge

# Dependabot's minor, patch and security updates merge on their own once the
# required checks pass (GitHub's auto-merge, which needs "Allow auto-merge"
# in the repository's settings). Majors wait for a person.
#
# A merge made with this token starts no workflow, so the push to main does
# not run release.yml: its daily schedule picks the merge up instead.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --auto --squash "$PR"
