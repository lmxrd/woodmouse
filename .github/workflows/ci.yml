name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The two jobs are independent, so they run side by side: the checks and
# tests, and the release build with its image. Nothing is pushed: releases
# publish, CI only verifies.
jobs:
  # The quality gates, exactly as locally: the tools come from mise (mise.toml,
  # package.json, rust-toolchain.toml) and
  # the checks and tests are the same tasks. The default target on the bare
  # runner — no matrix, no cross compiling. One job, so the dev build of the
  # backend (and of the OpenAPI spec) is done once and shared.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/backend
          key: checks
      - run: mise run check
      - run: mise run test

  # The release binary for each architecture, natively on its own runner
  # (static musl, so it runs in the Alpine image and on any Ubuntu or
  # Debian), with the frontend embedded — the same task as locally. The image
  # is that binary copied in by the Dockerfile (nothing compiles in it),
  # started once to check its health check, so a packaging bug fails the PR,
  # not the release.
  build:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-binary
      # BuildKit (the default) sets TARGETARCH, which picks the binary.
      - run: docker build -t woodmouse:ci .
      - name: Run the image and check its health check
        run: |
          docker run --rm -d --name woodmouse-ci woodmouse:ci
          # The image's own HEALTHCHECK (woodmouse healthcheck).
          for _ in $(seq 1 15); do
            status="$(docker inspect -f '{{.State.Health.Status}}' woodmouse-ci)"
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs woodmouse-ci
          exit 1
      # Its Alpine packages: a fixable HIGH or CRITICAL one fails the PR.
      # Trivy's database is cached for the day (security.yml scans the
      # published image every day).
      - id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.day.outputs.day }}
          restore-keys: trivy-db-
      - run: mise run audit:image
        env:
          IMAGE: woodmouse:ci
      # The amd64 image, for the end-to-end tests below.
      - name: Keep the image
        if: matrix.arch == 'amd64'
        run: docker save woodmouse:ci | gzip > woodmouse-image.tar.gz
      - uses: actions/upload-artifact@v7
        if: matrix.arch == 'amd64'
        with:
          name: image-amd64
          path: woodmouse-image.tar.gz
          retention-days: 1

  # The Playwright smoke tests (packages/e2e) against that image, started
  # with a fresh database file in a volume: first setup, signing out and in,
  # two-factor sign-in, a project and a task. Only Node and pnpm are
  # installed, and only Chromium, cached by Playwright's version.
  e2e:
    needs: build
    runs-on: ubuntu-latest
    env:
      MISE_AUTO_INSTALL: "false"
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: node pnpm
      - uses: actions/download-artifact@v8
        with:
          name: image-amd64
      - run: gunzip -c woodmouse-image.tar.gz | docker load
      - run: pnpm install --frozen-lockfile
      - id: playwright
        run: echo "version=$(pnpm --filter woodmouse-e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter woodmouse-e2e exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter woodmouse-e2e exec playwright install-deps chromium
      - run: scripts/e2e.sh
        env:
          IMAGE: woodmouse:ci
          ENGINE: docker
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: packages/e2e/playwright-report
          retention-days: 7
