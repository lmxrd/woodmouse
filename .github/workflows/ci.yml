name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The two jobs are independent, so they run side by side: the checks and
# tests, and the release build with its image. Nothing is pushed: releases
# publish, CI only verifies.
jobs:
  # The quality gates, exactly as locally: the tools come from mise.toml and
  # the checks and tests are the same tasks. The default target on the bare
  # runner — no matrix, no cross compiling. One job, so the dev build of the
  # backend (and of the OpenAPI spec) is done once and shared.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/backend
          key: checks
      - run: mise run check
      - run: mise run test

  # The release binary for each architecture, natively on its own runner
  # (static musl, so it runs in the Alpine image and on any Ubuntu or
  # Debian), with the frontend embedded — the same task as locally. The image
  # is the binary packaged by the Dockerfile through the `bin` build context
  # (nothing compiles in it), started once to check its health check, so a
  # packaging bug fails the PR, not the release.
  build:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build-binary
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: bin=./packages/backend/target/dist
          load: true
          tags: woodmouse:ci
      - name: Run the image and check its health check
        run: |
          docker run --rm -d --name woodmouse-ci woodmouse:ci
          # The image's own HEALTHCHECK (woodmouse healthcheck).
          for _ in $(seq 1 15); do
            status="$(docker inspect -f '{{.State.Health.Status}}' woodmouse-ci)"
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs woodmouse-ci
          exit 1
