name: Release

# Every push to main updates the release PR (version bump and changelog,
# from the conventional commits). Merging it creates the tag and the
# GitHub release, and only then do the jobs below run: natively on an
# amd64 and an arm64 runner (no cross compiling, no emulation) one job
# builds the Linux binary, attaches it to the release and packages that
# very binary into the image (nothing compiles in it), pushed to the GitHub
# Container Registry; `manifest` makes them one multi-arch image. CI never pushes,
# except the lockfile fix below on the release PR's branch.
#
# Needs "Allow GitHub Actions to create and approve pull requests" in the
# repository's Actions settings.

on:
  push:
    branches: [main]
  # Daily too: Dependabot's updates are merged by a workflow's token, and a
  # push made with that token starts no workflow, so this picks them up
  # (it only updates the release PR; a release still needs it merged).
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

      # release-please bumps the version in packages/backend/Cargo.toml but cannot
      # bump the woodmouse entry of packages/backend/Cargo.lock (its toml updater does
      # not match it), so cargo does it on the release PR's branch. `-w`
      # touches only the workspace's own packages, never a dependency.
      # A push with the default token starts no workflow; the next push to
      # main makes release-please rewrite the branch, and this runs again.
      - uses: actions/checkout@v7
        if: steps.release.outputs.prs_created == 'true'
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}

      - name: Update Cargo.lock on the release PR
        if: steps.release.outputs.prs_created == 'true'
        run: |
          cargo update --workspace --manifest-path packages/backend/Cargo.toml
          if git diff --quiet -- packages/backend/Cargo.lock; then
            echo "Cargo.lock is up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/backend/Cargo.lock
            git commit -m "chore: update Cargo.lock to the release version"
            git push
          fi

  # musl binaries are static and run on any Linux (Ubuntu, Debian, ...).
  # Each runner builds its binary once, attaches it to the release and
  # pushes the image made from it by digest only; `manifest` tags them.
  binaries-and-image:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: ./.github/actions/build-binary
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          mkdir release
          cp "dist/woodmouse-linux-${{ matrix.arch }}" release/
          # The OpenAPI spec (written by the build, identical on both
          # runners), attached once.
          if [ "${{ matrix.arch }}" = amd64 ]; then
            cp packages/backend/target/specs/openapi.json packages/backend/target/specs/openapi.yaml release/
          fi
          gh release upload "$TAG" release/* --clobber
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # buildx sets TARGETARCH, which picks dist/woodmouse-linux-<arch>.
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - run: |
          mkdir digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  # One SHA256SUMS for everything attached (both binaries and the spec),
  # once both runners have uploaded: `sha256sum -c SHA256SUMS
  # --ignore-missing` checks a download.
  checksums:
    needs: [release-please, binaries-and-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Write and attach SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release \
            --pattern 'woodmouse-linux-*' --pattern 'openapi.*'
          (cd release && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          gh release upload "$TAG" release/SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber

  # The tags 1.2.3, 1.2 and latest (prereleases get only the exact
  # version), pointing at both images.
  manifest:
    needs: [release-please, binaries-and-image]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true
      - uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag }}
            type=raw,value=latest,enable=${{ !contains(needs.release-please.outputs.tag, '-') }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " $(ls digests))
