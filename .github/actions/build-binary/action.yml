name: Build the release binary
description: >
  The static (musl) release binary for the runner's CPU architecture, with
  the frontend embedded: the same `mise run build:linux` as locally.
  The result is dist/woodmouse-linux-<arch>.

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v4
    # No central target directory on the runner: the target is
    # packages/backend/target. Its own key, apart from the checks' dev build.
    - uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          packages/backend/target
        key: cargo-linux-${{ runner.arch }}-${{ hashFiles('packages/backend/Cargo.lock') }}
        restore-keys: cargo-linux-${{ runner.arch }}-
    - uses: actions/cache@v6
      with:
        path: ~/.local/share/pnpm/store
        key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
    # The frontend is built from the OpenAPI spec the backend writes first;
    # zig is the C toolchain for the bundled SQLite and ring.
    - run: mise run build:linux
      shell: bash
    # Static is what lets the one binary run on any Ubuntu or Debian (and
    # in the Alpine image): fail if a dependency ever links a libc.
    - name: The binary is static
      shell: bash
      run: file dist/woodmouse-linux-* | tee /dev/stderr | grep -Eq 'statically linked|static-pie linked'
