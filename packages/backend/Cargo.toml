[package]
name = "woodmouse"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish = false

[workspace]
resolver = "2"
members = [".", "api", "entity", "migration"]

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.99.0"

# Dependencies used by more than one crate: versions and shared features live here, a crate adds only
# what it needs on top (`tokio = { workspace = true, features = [..] }`).
# No unsafe code in any crate of the workspace (each opts in with `[lints] workspace = true`);
# `forbid` cannot be allowed again further in.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
api = { path = "api" }
entity = { path = "entity" }
migration = { path = "migration" }

anyhow = "1.0.104"
async-trait = "0.1.92"
axum-login = "0.18.0"
axum-test = "21.1.0"
axum = "0.8.9"
governor = "0.10.4"
jiff = { version = "0.2.38", features = ["serde", "tzdb-bundle-always"] }
mime_guess = "2.0.5"
# SQLite (bundled, with FTS5) through sqlx, with SeaORM on top.
sea-orm = { version = "2.0.4", default-features = false, features = ["sqlx-sqlite", "runtime-tokio", "macros", "with-uuid", "with-json"] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["sqlx-sqlite", "runtime-tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
# The pool under SeaORM; used directly where SeaORM does not reach (pragmas on one connection).
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "uuid"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = "1.54.1"
tower-sessions = { version = "0.14.0", default-features = false, features = ["axum-core"] }
# Two-factor sign-in (TOTP, RFC 6238); `otpauth` adds the URL an authenticator app reads from the QR code.
totp-rs = { version = "6.0.0", features = ["otpauth"] }
# `release_max_level_info`: debug and trace events are compiled out of release builds (smaller binary).
tracing = { version = "0.1.44", features = ["release_max_level_info"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "6.0.0", features = ["uuid", "yaml"] }
uuid = { version = "1.29.0", features = ["v4", "v7", "serde"] }

# The server binary: the library crates plus the embedded frontend (a module of this binary, so the library and
# the spec generator build without `packages/frontend/dist`).
[dependencies]
api.workspace = true
anyhow.workspace = true
axum.workspace = true
mime_guess.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "net", "io-util", "time", "sync"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing.workspace = true
tracing-subscriber.workspace = true
rust-embed = "8.13.0"
utoipa-swagger-ui = { version = "10.0.2", features = ["axum"] }

# Small release binaries (size matters more than build time): fat LTO and one
# codegen unit. opt-level = "s" was tried and saved nothing here. The release
# workflow and `mise run build:linux` both build with this profile.
[profile.release]
strip = true
lto = true
codegen-units = 1

# Password hashing is deliberately slow; unoptimized it makes logins (and so the tests) crawl.
[profile.dev.package]
argon2 = { opt-level = 3 }
blake2 = { opt-level = 3 }

[lints]
workspace = true
