# Tasks: `mise run <task>` (`mise r <task>`).
[tasks.check]
description = "rustfmt check + clippy"
run = [
  "cargo fmt --all --check",
  "cargo clippy --all-targets --all-features -- -D warnings",
]

[tasks.fix]
description = "rustfmt + clippy --fix"
run = [
  "cargo fmt --all",
  "cargo clippy --fix --allow-dirty --allow-staged --allow-no-vcs --all-targets --all-features -- -D warnings",
]

[tasks.specs]
description = "Generate OpenAPI specs into target/specs/ (cargo specs)"
run = "cargo specs"
# Skip regeneration while the sources are older than the generated specs
# (force with `mise run --force specs`); also feeds `mise watch specs`.
sources = ["src/**/*.rs", "Cargo.toml"]
outputs = ["target/specs/openapi.json", "target/specs/openapi.yaml"]
