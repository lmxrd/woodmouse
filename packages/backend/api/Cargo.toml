[package]
name = "api"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
publish = false

[dependencies]
entity.workspace = true
migration.workspace = true

async-trait.workspace = true
axum = { workspace = true, features = ["multipart", "ws"] }
axum-extra = { version = "0.12", features = ["cookie", "cookie-signed"] }
jiff.workspace = true
mime_guess.workspace = true
sea-orm.workspace = true
sea-orm-migration.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "fs", "time", "sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
uuid.workspace = true

utoipa-axum = "0.3"
argon2 = "0.6"
sha2 = "0.11"
totp-rs.workspace = true
time = "0.3"
sqlx.workspace = true

zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
yrs = { version = "0.28", features = ["sync"] }
futures-util = "0.3.34"
base64 = "0.23.1"
lettre = { version = "0.11.23", default-features = false, features = ["tokio1-rustls", "webpki-roots", "ring", "smtp-transport", "builder", "hostname"] }
csv = "1.4.0"
# Single sign-on. Without default features: they bring reqwest 0.12 and aws-lc; the provider calls go
# through our own client (`oidc::Http`), on the rustls + ring + webpki-roots stack lettre already uses.
openidconnect = { version = "4.1", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
http-body-util = "0.1"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5", features = ["util"] }
