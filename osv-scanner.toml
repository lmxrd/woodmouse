# Known vulnerabilities that are accepted, each with the reason. Each one
# expires (`ignoreUntil`), so it comes back up in `mise run audit` and the
# daily Security workflow to be looked at again.

[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
ignoreUntil = 2027-05-06
reason = "rsa (Marvin attack): no fixed version exists. It comes in through openidconnect, which only verifies the provider's RS256 signatures with its public key; the timing side channel is in decrypting and signing with a private key, which Woodmouse never does."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0215"
ignoreUntil = 2027-05-06
reason = "smallstr is unmaintained (an informational advisory, no known vulnerability); it comes in through yrs, the live-editing CRDT, which has no release without it yet."
